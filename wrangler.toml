name = "daily-verse-aastu-bot"
main = "app/cloudflare_worker.py"
compatibility_date = "2026-11-03"
compatibility_flags = ["python_workers"]

[vars]
MINI_APP_URL = "https://daily-verse-aastu.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "daily-verse-aastu"
database_id = "9f54c8d0-a0e0-4e65-a79b-7d2be40c224a"
migrations_dir = "cloudflare/worker/migrations"

[[queues.producers]]
queue = "daily-verse-reminders"
binding = "REMINDER_QUEUE"

[[queues.consumers]]
queue = "daily-verse-reminders"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 5

[triggers]
# Cloudflare Cron uses UTC. Each minute in these hours is checked by the
# Worker; it sends only at 06:00, 12:00, and 18:00 East Africa Time.
crons = ["* 3,9,15 * * *"]
