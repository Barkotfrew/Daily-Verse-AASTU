name: Deploy Daily Verse Mini App

on:
  push:
    branches: [main]
    paths:
      - "app/bible.py"
      - "app/references.py"
      - "data/bible/source/amharic_bible.json"
      - "scripts/build_miniapp.py"
      - "webapp/**"
      - ".github/workflows/deploy-miniapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build chapter-sized static assets
        run: python scripts/build_miniapp.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webapp/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
