<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Daily Verse · Bible Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600&family=Noto+Serif+Ethiopic:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-logo-wrap">
          <img class="brand-logo" src="./images/aastu-ecsf-logo.png" alt="AASTU ECSF">
        </div>
        <div class="brand-copy">
          <h1>Daily Verse</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">☀</button>
      </header>

      <section class="reader-card" aria-labelledby="reader-title">
        <div class="section-kicker">
          <span aria-hidden="true"></span>
          <p class="eyebrow">ቅዱስ መጽሐፍ · AMHARIC SCRIPTURE</p>
          <span aria-hidden="true"></span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Loading the Bible index…</p>
        <article id="chapter-content" class="chapter-content" aria-live="polite"></article>
        <details id="saved-bookmarks" class="saved-bookmarks">
          <summary>Bookmarks <span id="bookmark-count">0</span></summary>
          <div id="bookmark-list" class="bookmark-list"></div>
        </details>
        <nav id="day-nav" class="day-nav" aria-label="Reading plan navigation" hidden>
          <button id="previous-day" class="secondary-button" type="button">← Day (Previous)</button>
          <span id="day-count" class="day-count"></span>
          <button id="next-day" class="secondary-button" type="button">Day (Next) →</button>
        </nav>
        <details id="browse-bible" class="browse-bible">
          <summary>Browse Bible</summary>
          <div id="selectors" class="selectors">
            <label for="book-select">Book</label>
            <span class="select-wrap"><select id="book-select" disabled></select></span>
            <label for="chapter-select">Chapter</label>
            <span class="select-wrap"><select id="chapter-select" disabled></select></span>
          </div>
          <div id="chapter-nav" class="chapter-nav">
            <button id="previous-button" class="secondary-button" type="button" disabled>← Previous</button>
            <button id="open-button" class="primary-button" type="button" disabled>Open chapter</button>
            <button id="next-button" class="secondary-button" type="button" disabled>Next →</button>
          </div>
          <button id="return-reading" class="return-reading" type="button" hidden>Return to assigned reading</button>
        </details>
      </section>

      <footer><span aria-hidden="true">†</span> Daily Verse · Amharic Bible <span aria-hidden="true">†</span></footer>
    </main>
  </body>
</html>
