<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Daily Chapters · Bible Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-logo" role="img" aria-label="AASTU ECSF"></div>
          <div class="brand-copy">
            <h1>Daily Chapters</h1>
          </div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
      </header>

      <p id="reading-date" class="reading-date" hidden></p>
      <nav id="chapter-tabs" class="chapter-tabs" aria-label="Assigned chapters" hidden></nav>

      <section class="reader-card">
        <div class="section-kicker">
          <span aria-hidden="true"></span>
          <p class="eyebrow">ቅዱስ መጽሐፍ · AMHARIC SCRIPTURE</p>
          <span aria-hidden="true"></span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Loading the Bible index…</p>
        <article id="chapter-content" class="chapter-content" aria-live="polite"></article>
        <nav id="day-nav" class="day-nav" aria-label="Reading plan navigation" hidden>
          <button id="previous-day" class="secondary-button" type="button">← Day (Previous)</button>
          <span id="day-count" class="day-count"></span>
          <button id="next-day" class="secondary-button" type="button">Day (Next) →</button>
        </nav>
        <details id="saved-bookmarks" class="saved-bookmarks">
          <summary>Bookmarks <span id="bookmark-count">0</span></summary>
          <div id="bookmark-list" class="bookmark-list"></div>
        </details>
        <details id="browse-bible" class="browse-bible">
          <summary>Browse Bible</summary>
          <div id="selectors" class="selectors">
            <label for="book-select">Book</label>
            <span class="select-wrap"><select id="book-select" disabled></select></span>
            <label for="chapter-select">Chapter</label>
            <span class="select-wrap"><select id="chapter-select" disabled></select></span>
          </div>
          <div id="chapter-nav" class="chapter-nav">
            <button id="open-button" class="primary-button" type="button" disabled>Open chapter</button>
          </div>
          <button id="return-reading" class="return-reading" type="button" hidden>Return to assigned reading</button>
        </details>
      </section>

    </main>
    <nav class="reader-toolbar" aria-label="Reading controls">
      <div class="reading-progress" aria-hidden="true"><span id="reading-progress-fill"></span></div>
      <div class="toolbar-inner">
        <button id="previous-button" class="toolbar-icon" type="button" aria-label="Previous chapter" title="Previous chapter" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="font-controls" aria-label="Verse text size">
          <button id="font-decrease" class="toolbar-icon" type="button" aria-label="Decrease text size" title="Decrease text size">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <span>Aa</span>
          <button id="font-increase" class="toolbar-icon" type="button" aria-label="Increase text size" title="Increase text size">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button id="next-button" class="toolbar-icon" type="button" aria-label="Next chapter" title="Next chapter" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </nav>
    <footer class="site-footer">@AASTU_ECSF_DailyVerse_2026Bot</footer>
  </body>
</html>
